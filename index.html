<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Little Shop POS</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛒</text></svg>" />
</head>
<body>
  <section id="landing" hidden>
    <h1 id="landing-title">🛒 Pick a Menu</h1>
    <div id="landing-grid"></div>
  </section>

  <header id="topbar">
    <button id="home-btn" title="Switch menu">←</button>
    <h1 id="title"><span id="brand-emoji">🛒</span> <span id="brand">Little Shop</span></h1>
    <nav id="views">
      <button data-view="order">Order</button>
      <button data-view="payment">Payment</button>
      <button data-view="kitchen">Kitchen</button>
      <button data-view="business">Business</button>
    </nav>
  </header>

  <main id="main">
    <section id="view-order" class="view">
      <div id="menu">
        <p id="greeting"></p>
        <div id="grid"></div>
      </div>
      <aside id="receipt-panel">
        <div id="receipt"></div>
        <div id="order-totals" hidden></div>
        <div id="actions">
          <button id="clear-btn" class="ghost">Clear</button>
          <button id="charge-btn">Charge</button>
        </div>
      </aside>
    </section>

    <section id="view-payment" class="view" hidden></section>
    <section id="view-kitchen" class="view" hidden></section>
    <section id="view-business" class="view" hidden>
      <div id="biz-bar">
        <nav id="biz-tabs"></nav>
        <div id="biz-actions"></div>
      </div>
      <div id="biz-content"></div>
    </section>
  </main>

  <!-- Modifier picker -->
  <div id="mod-overlay" class="overlay" hidden>
    <div class="sheet">
      <h2 id="mod-title"></h2>
      <div id="mod-list"></div>
      <div class="sheet-actions">
        <button id="mod-remove" class="danger" type="button" hidden>Remove</button>
        <button id="mod-cancel" class="ghost">Cancel</button>
        <button id="mod-add">Add to order</button>
      </div>
    </div>
  </div>

  <!-- New menu -->
  <div id="new-overlay" class="overlay" hidden>
    <div class="sheet">
      <h2>🍴 New Menu</h2>
      <form id="new-form">
        <label>Menu name <input name="name" placeholder="e.g. Bella's Bistro" /></label>
        <label>Icon <input name="emoji" maxlength="4" /></label>
        <label>Based on <select name="base"></select></label>
      </form>
      <div class="sheet-actions">
        <button id="new-cancel" class="ghost" type="button">Cancel</button>
        <button id="new-create" type="button">Create</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
